4")},{tag:"Ayat Tanya",text:Z("Persoalannya, apakah kesan-kesan pembuangan sampah yang tidak terkawal terhadap alam sekitar, masyarakat dan negara?","J4n91.s5")}],mK=[{label:"Apa",text:Z("Pada pandangan saya, kesan dominan pembuangan sampah secara tidak terkawal ialah berlakunya pencemaran alam sekitar yang merosakkan keseimbangan habitat semula jadi.","9aYYC.s")},{label:"Mengapa",text:Z("Hal ini dikatakan demikian kerana sisa toksik dan bahan buangan yang meresap ke dalam tanah serta sumber air akan meracuni alam sekitar, sekali gus memutuskan rantai makanan hidupan.","9aYYC.s2")},{label:"Contoh",text:Z("Tamsilnya, pereputan sisa organik dan bahan buangan elektronik di tapak pelupusan haram menghasilkan larut lesap yang membebaskan ion logam berat seperti plumbum dan kadmium, sekali gus mengubah tahap keasidan (pH) tanah yang dapat merencat tindak balas enzim dalam sel tumbuhan.","9aYYC.s3")},{label:"Kesan",text:Z("Kesannya, proses fotosintesis tumbuhan akan terganggu dan banyak hidupan akuatik mati akibat keracunan bahan kimia tersebut.","9aYYC.s4")},{label:"Penegasan",text:Z("Sudah terang lagi bersuluh, pembuangan sampah yang tidak terkawal dapat menjejaskan alam sekitar serta biodiversiti yang terancam.","9aYYC.s5")}],hK=[{label:"Apa",text:Z("Beralih kepada perspektif seterusnya, pembuangan sampah secara tidak terkawal turut menjejaskan kesihatan manusia di samping mengancam kesejahteraan komuniti.","RYTjD.s")},{label:"Mengapa",text:Z("Hal ini berlaku kerana pereputan sisa sampah organik di kawasan terbuka membebaskan gas beracun yang mencemarkan udara, sekali gus mengganggu pengambilan oksigen bersih oleh sistem pernafasan manusia.","RYTjD.s2")},{label:"Contoh",text:Z("Contohnya, pereputan sisa pepejal organik di tapak pelupusan haram membebaskan gas toksik seperti hidrogen sulfida dan metana ke atmosfera, sekali gus merengsa saluran pernafasan serta mengurangkan kadar penyerapannya di alveolus.","RYTjD.s3")},{label:"Kesan",text:Z("Sebagai akibatnya, individu yang terdedah secara berterusan berisiko tinggi dijangkiti penyakit kronik seperti asma, bronkitis, dan jangkitan paru-paru.","RYTjD.s4")},{label:"Penegasan",text:Z("Sudah tidak dapat dinafikan lagi bahawa pembuangan sampah yang tidak terkawal boleh memudaratkan sistem respirasi manusia serta mencemarkan kualiti hidup masyarakat setempat.","RYTjD.s5")}],vK=[{label:"Apa",text:Z("Jika ditinjau dari sudut yang lain pula, isu pembuangan sampah yang tidak terkawal turut mencemarkan imej negara di mata masyarakat global dan pelancong asing.","xSnxy.s")},{label:"Mengapa",text:Z("Hal ini berlaku kerana pemandangan kotor akibat sampah yang berselerak di tempat awam boleh merosakkan kepercayaan pelancong luar terhadap tahap kebersihan dan keindahan negara kita.","xSnxy.s2")},{label:"Contoh",text:Z("Sebagai contoh, kawasan pelancongan yang popular dan taman rekreasi sering dipenuhi dengan timbunan sampah sarap seperti botol plastik serta sisa makanan yang ditinggalkan pengunjung, sekali gus menghasilkan pemandangan yang tidak enak dipandang oleh pelancong luar.","xSnxy.s3")},{label:"Kesan",text:Z("Sebagai impaknya, pelancong asing akan memberikan pandangan yang negatif terhadap tahap kebersihan persekitaran yang kurang memuaskan, sekali gus menjejaskan reputasi negara di peringkat antarabangsa.","xSnxy.s4")},{label:"Penegasan",text:Z("Jelaslah bahawa pengurusan sisa yang cekap dan sikap prihatin rakyat terhadap kebersihan amat penting demi mempertahankan imej negara.","xSnxy.s5")}],gK=[{label:"Tegasan",text:Z("Berdasarkan huraian idea tentang kesan-kesan pembuangan sampah yang tidak terkawal, jelaslah bahawa isu ini memudaratkan kelestarian alam, kesihatan awam, serta reputasi negara kita.","mcyl9.s")},{label:"Ajakan",text:Z("Oleh itu, segenap lapisan masyarakat dan pihak berkuasa hendaklah berganding bahu, bak kata peribahasa Melayu ada menyatakan bagai aur dengan tebing dalam memantapkan pengurusan sisa pepejal serta membudayakan amalan kitar semula.","mcyl9.s2")},{label:"Harapan",text:Z("Dengan erti kata lain, setiap individu perlu memberikan komitmen yang berterusan agar dapat mewujudkan persekitaran yang bersih dan menjamin kesejahteraan hidup generasi akan datang.","mcyl9.s3")},{label:"Kesimpulan",text:Z("Sebagai kesimpulannya, menjaga kebersihan alam sekitar merupakan tanggungjawab bersama kerana persekitaran yang bersih melambangkan kesejahteraan hidup rakyat dan kemajuan negara.","mcyl9.s4")}],Lh=[{id:"tajuk",title:Z("Tajuk","x6hw9.s")},{id:"soalan",title:Z("Soalan","x6hw9.s2")},{id:"analisis",title:Z("Analisis","x6hw9.s3")},{id:"pendahuluan",title:Z("Pendahuluan","x6hw9.s4")},{id:"isi1",title:Z("Isi 1","x6hw9.s5")},{id:"isi2",title:Z("Isi 2","x6hw9.s6")},{id:"isi3",title:Z("Isi 3","x6hw9.s7")},{id:"penutup",title:Z("Penutup","x6hw9.s8")},{id:"sekian",title:Z("Sekian","x6hw9.s9")}];function sS(){let[e,t]=(0,gd.useState)(0),[a,n]=(0,gd.useState)("tajuk");(0,gd.useEffect)(()=>{let i=o(()=>{let c=document.getElementById("root");return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||(c?c.scrollTop:0)},"getScrollTop"),l=o(()=>{let c=i();t(c);for(let u=Lh.length-1;u>=0;u--){let f=document.getElementById(Lh[u].id);if(f&&f.getBoundingClientRect().top<=250){n(Lh[u].id);break}}},"handleScroll");window.addEventListener("scroll",l,{passive:!0}),document.addEventListener("scroll",l,{passive:!0});let s=document.getElementById("root");return s&&s.addEventListener("scroll",l,{passive:!0}),()=>{window.removeEventListener("scroll",l),document.removeEventListener("scroll",l),s&&s.removeEventListener("scroll",l)}},[]);let r=o(i=>{let l=document.getElementById(i);l&&(l.scrollIntoView({behavior:"smooth",block:"start"}),setTimeout(()=>{let s=document.getElementById("root"),c=window.scrollY||document.documentElement.scrollTop||(s?s.scrollTop:0),u=l.offsetTop-20;Math.abs(c-u)>50&&(window.scrollTo({top:u,behavior:"smooth"}),s&&s.scrollTo({top:u,behavior:"smooth"}))},100))},"scrollToSection");return(0,V.jsxs)("div",{"data-e":"f
